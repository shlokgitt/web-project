<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking | TravelGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1622;
    --ink-raised:#142536;
    --ink-line:#1F3850;
    --terracotta:#C9542C;
    --terracotta-bright:#E0673B;
    --amber:#E8A33D;
    --paper:#F4F1E8;
    --slate:#8FA3B8;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:16px;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--ink);
    color:var(--paper);
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; }

  header{
    background:var(--ink-raised);
    border-bottom:1px solid var(--ink-line);
    color:#fff;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  header .logo{ font-size:1.4rem; font-weight:700; }
  header .logo span{ color:var(--terracotta); }
  header nav a{
    color:var(--slate);
    text-decoration:none;
    margin-left:18px;
    font-size:0.95rem;
    font-weight:500;
  }
  header nav a:hover{ color:var(--paper); }

  .page-title{
    max-width:1100px;
    margin:40px auto 6px;
    padding:0 6%;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.75rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:10px;
    display:block;
  }
  .page-title h1{
    margin:0 0 8px;
    font-size:2.1rem;
    color:#fff;
  }
  .page-title p{
    margin:0;
    color:var(--slate);
  }

  .search-card{
    max-width:1100px;
    margin:28px auto;
    padding:26px;
    background:var(--ink-raised);
    border:1px solid var(--ink-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .search-grid{
    display:grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap:14px;
    align-items:end;
  }
  @media (max-width: 900px){
    .search-grid{ grid-template-columns: 1fr 1fr; }
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .field label{
    font-size:0.74rem;
    font-weight:600;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-family:var(--font-mono);
  }
  .field input, .field select{
    padding:12px 13px;
    border:1px solid var(--ink-line);
    border-radius:9px;
    font-size:0.95rem;
    outline:none;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
  }
  .field input:focus, .field select:focus{
    border-color:var(--terracotta);
  }
  .search-btn{
    background:var(--terracotta);
    color:#fff;
    border:none;
    padding:13px 24px;
    border-radius:9px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.2s;
  }
  .search-btn:hover{ background:var(--terracotta-bright); }
  .search-btn:disabled{ background:#5a4034; cursor:not-allowed; }

  .suggestions{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:var(--ink-raised);
    border:1px solid var(--ink-line);
    border-radius:10px;
    margin-top:4px;
    max-height:240px;
    overflow-y:auto;
    box-shadow:var(--shadow);
    z-index:30;
    display:none;
  }
  .suggestions.open{ display:block; }
  .suggestion-item{
    padding:11px 13px;
    cursor:pointer;
    font-size:0.9rem;
    border-bottom:1px solid var(--ink-line);
    color:var(--paper);
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover, .suggestion-item.active{
    background:var(--ink);
  }
  .suggestion-item small{
    display:block;
    color:var(--slate);
    font-size:0.78rem;
  }

  .status-msg{
    max-width:1100px;
    margin:18px auto;
    padding:0 6%;
    color:var(--slate);
    font-size:0.95rem;
  }
  .status-msg.error{ color:var(--terracotta-bright); }

  .results-header{
    max-width:1100px;
    margin:32px auto 16px;
    padding:0 6%;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .results-header h2{
    margin:0;
    font-size:1.4rem;
    color:#fff;
  }
  .results-header span{
    color:var(--slate);
    font-size:0.88rem;
    font-family:var(--font-mono);
  }

  .hotel-grid{
    max-width:1100px;
    margin:0 auto 60px;
    padding:0 6%;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:20px;
  }
  .hotel-card{
    background:var(--ink-raised);
    border:1px solid var(--ink-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:9px;
    transition:transform 0.2s, border-color 0.2s;
  }
  .hotel-card:hover{ transform:translateY(-3px); }
  .hotel-card .badge{
    align-self:flex-start;
    background:rgba(201,84,44,0.15);
    color:var(--amber);
    font-size:0.7rem;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    font-family:var(--font-mono);
  }
  .hotel-card h3{
    margin:4px 0 0;
    font-size:1.1rem;
    color:#fff;
    font-family:var(--font-body);
    font-weight:700;
  }
  .hotel-card .addr{
    color:var(--slate);
    font-size:0.88rem;
    line-height:1.4;
  }
  .hotel-card .meta{
    display:flex;
    gap:14px;
    font-size:0.82rem;
    color:var(--slate);
    margin-top:4px;
    font-family:var(--font-mono);
  }
  .hotel-card .select-btn{
    margin-top:10px;
    background:transparent;
    border:1px solid var(--terracotta);
    color:var(--terracotta-bright);
    padding:10px 16px;
    border-radius:8px;
    font-size:0.88rem;
    font-weight:700;
    cursor:pointer;
    align-self:flex-start;
    transition:background 0.2s, color 0.2s;
  }
  .hotel-card .select-btn:hover{ background:var(--terracotta); color:#fff; }
  .hotel-card.selected{
    outline:2px solid var(--terracotta);
  }

  .skeleton{
    background:linear-gradient(90deg, var(--ink-raised) 25%, var(--ink-line) 37%, var(--ink-raised) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s infinite;
    border-radius:var(--radius);
    height:160px;
  }
  @keyframes shimmer{
    0%{background-position:100% 0;}
    100%{background-position:0 0;}
  }

  .booking-summary{
    max-width:560px;
    margin:0 auto 70px;
    padding:28px;
    background:var(--ink-raised);
    border:1px solid var(--ink-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:none;
  }
  .booking-summary.open{ display:block; }
  .booking-summary h2{ margin-top:0; font-size:1.3rem; color:#fff; }
  .booking-summary .row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px dashed var(--ink-line);
    font-size:0.92rem;
  }
  .booking-summary .row:last-of-type{ border-bottom:none; }
  .booking-summary .row span:first-child{ color:var(--slate); }
  .booking-summary .row span:last-child{ font-family:var(--font-mono); color:var(--paper); }
  .confirm-btn{
    margin-top:18px;
    width:100%;
    background:var(--terracotta);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:0.98rem;
    font-weight:700;
    cursor:pointer;
    transition:background 0.2s;
  }
  .confirm-btn:hover{ background:var(--terracotta-bright); }
  .note{
    max-width:1100px;
    margin:0 auto 30px;
    padding:0 6%;
    font-size:0.8rem;
    color:var(--slate);
    font-family:var(--font-mono);
  }
  footer{
    text-align:center;
    padding:22px;
    color:var(--slate);
    font-size:0.85rem;
    border-top:1px solid var(--ink-line);
    background:var(--ink-raised);
    font-family:var(--font-mono);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Travel<span>Go</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="bookingchoice.html">Booking</a>
    <a href="contactpage.html">Contact</a>
  </nav>
</header>

<div class="page-title">
  <span class="eyebrow">Step 2 of 3</span>
  <h1>🏨 Hotel Booking</h1>
  <p>Search any city in the world and see real hotels pulled live from OpenStreetMap.</p>
</div>

<div class="search-card">
  <div class="search-grid">
    <div class="field">
      <label for="cityInput">City</label>
      <input type="text" id="cityInput" placeholder="Try Mumbai, Paris, Tokyo..." autocomplete="off">
      <div class="suggestions" id="citySuggestions"></div>
    </div>
    <div class="field">
      <label for="checkin">Check-in</label>
      <input type="date" id="checkin">
    </div>
    <div class="field">
      <label for="checkout">Check-out</label>
      <input type="date" id="checkout">
    </div>
    <div class="field">
      <label for="guests">Guests</label>
      <select id="guests">
        <option value="1">1 Guest</option>
        <option value="2" selected>2 Guests</option>
        <option value="3">3 Guests</option>
        <option value="4">4 Guests</option>
        <option value="5">5+ Guests</option>
      </select>
    </div>
    <button class="search-btn" id="searchBtn">Search Hotels</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<div id="resultsArea"></div>

<div class="booking-summary" id="bookingSummary"></div>

<div class="note" id="apiNote"></div>

<footer>© 2026 TravelGo · All Rights Reserved</footer>

<script>
/* ============================================================
   TravelGo Hotel Booking — real city + hotel data
   City search:  Open-Meteo Geocoding API (free, no key, CORS-open)
   Hotel data:   OpenStreetMap Overpass API (free, no key)
   No payment / booking is actually processed — this is a
   front-end demo that surfaces real-world place data.
   ============================================================ */

const cityInput = document.getElementById('cityInput');
const citySuggestions = document.getElementById('citySuggestions');
const searchBtn = document.getElementById('searchBtn');
const statusMsg = document.getElementById('statusMsg');
const resultsArea = document.getElementById('resultsArea');
const bookingSummary = document.getElementById('bookingSummary');
const checkinInput = document.getElementById('checkin');
const checkoutInput = document.getElementById('checkout');
const guestsSelect = document.getElementById('guests');

let selectedCity = null;   // { name, lat, lon, country }
let debounceTimer = null;
let activeSuggestionIndex = -1;

// Default sensible dates
(function setDefaultDates(){
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const dayAfter = new Date(today); dayAfter.setDate(today.getDate()+3);
  checkinInput.value = tomorrow.toISOString().split('T')[0];
  checkoutInput.value = dayAfter.toISOString().split('T')[0];
  checkinInput.min = today.toISOString().split('T')[0];
})();

// ---------- City autocomplete (Open-Meteo Geocoding) ----------
cityInput.addEventListener('input', () => {
  const q = cityInput.value.trim();
  selectedCity = null;
  clearTimeout(debounceTimer);
  if (q.length < 2) {
    closeSuggestions();
    return;
  }
  debounceTimer = setTimeout(() => fetchCitySuggestions(q), 300);
});

cityInput.addEventListener('keydown', (e) => {
  const items = citySuggestions.querySelectorAll('.suggestion-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
    updateActiveSuggestion(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
    updateActiveSuggestion(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeSuggestionIndex >= 0) items[activeSuggestionIndex].click();
    else searchBtn.click();
  }
});

function updateActiveSuggestion(items){
  items.forEach(i => i.classList.remove('active'));
  if (items[activeSuggestionIndex]) {
    items[activeSuggestionIndex].classList.add('active');
    items[activeSuggestionIndex].scrollIntoView({block:'nearest'});
  }
}

async function fetchCitySuggestions(query){
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    renderSuggestions(data.results || []);
  } catch(err){
    console.error('City lookup failed:', err);
    closeSuggestions();
  }
}

function renderSuggestions(results){
  activeSuggestionIndex = -1;
  if (!results.length){
    closeSuggestions();
    return;
  }
  citySuggestions.innerHTML = results.map((r, idx) => `
    <div class="suggestion-item" data-idx="${idx}">
      ${r.name}${r.admin1 ? ', ' + r.admin1 : ''}
      <small>${r.country || ''}</small>
    </div>
  `).join('');
  citySuggestions.classList.add('open');

  citySuggestions.querySelectorAll('.suggestion-item').forEach((el, idx) => {
    el.addEventListener('click', () => {
      const r = results[idx];
      selectedCity = { name: r.name, lat: r.latitude, lon: r.longitude, country: r.country };
      cityInput.value = `${r.name}${r.admin1 ? ', ' + r.admin1 : ''}, ${r.country}`;
      closeSuggestions();
    });
  });
}

function closeSuggestions(){
  citySuggestions.classList.remove('open');
  citySuggestions.innerHTML = '';
}

document.addEventListener('click', (e) => {
  if (!citySuggestions.contains(e.target) && e.target !== cityInput){
    closeSuggestions();
  }
});

// ---------- Hotel search (OpenStreetMap Overpass API) ----------
searchBtn.addEventListener('click', async () => {
  bookingSummary.classList.remove('open');
  bookingSummary.innerHTML = '';

  if (!selectedCity){
    showStatus('Please pick a city from the suggestions list first.', true);
    return;
  }
  if (checkoutInput.value <= checkinInput.value){
    showStatus('Check-out date must be after check-in date.', true);
    return;
  }

  showStatus(`Searching real hotels in ${selectedCity.name}…`, false);
  searchBtn.disabled = true;
  searchBtn.textContent = 'Searching…';
  renderSkeletons();

  try {
    const hotels = await fetchHotelsNearCity(selectedCity.lat, selectedCity.lon);
    renderResults(hotels);
  } catch(err){
    console.error(err);
    showStatus('Could not load hotel data right now. Please try again in a moment.', true);
    resultsArea.innerHTML = '';
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = 'Search Hotels';
  }
});

function renderSkeletons(){
  resultsArea.innerHTML = `
    <div class="results-header"><h2>Loading hotels…</h2></div>
    <div class="hotel-grid">
      ${Array(6).fill('<div class="skeleton"></div>').join('')}
    </div>
  `;
}

async function fetchHotelsNearCity(lat, lon, radiusMeters = 6000){
  const query = `
    [out:json][timeout:25];
    (
      node["tourism"="hotel"](around:${radiusMeters},${lat},${lon});
      way["tourism"="hotel"](around:${radiusMeters},${lat},${lon});
    );
    out center 40;
  `;
  const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Overpass API error: ' + res.status);
  const data = await res.json();

  const hotels = (data.elements || [])
    .map(el => {
      const tags = el.tags || {};
      const name = tags.name;
      if (!name) return null;
      const addrParts = [tags['addr:housenumber'], tags['addr:street'], tags['addr:suburb'], tags['addr:city']]
        .filter(Boolean);
      return {
        name,
        address: addrParts.length ? addrParts.join(', ') : 'Address not listed on OpenStreetMap',
        stars: tags.stars || null,
        phone: tags.phone || tags['contact:phone'] || null,
        website: tags.website || tags['contact:website'] || null,
        lat: el.lat || (el.center && el.center.lat),
        lon: el.lon || (el.center && el.center.lon)
      };
    })
    .filter(Boolean);

  const seen = new Set();
  const unique = [];
  for (const h of hotels){
    const key = h.name + '|' + h.address;
    if (!seen.has(key)){ seen.add(key); unique.push(h); }
  }
  return unique.slice(0, 24);
}

function renderResults(hotels){
  if (!hotels.length){
    showStatus(`No hotels are tagged on OpenStreetMap within range of ${selectedCity.name}. Try a larger nearby city.`, true);
    resultsArea.innerHTML = '';
    return;
  }

  showStatus(`Showing ${hotels.length} real hotel${hotels.length === 1 ? '' : 's'} near ${selectedCity.name}, sourced live from OpenStreetMap.`, false);

  resultsArea.innerHTML = `
    <div class="results-header">
      <h2>Hotels in ${selectedCity.name}</h2>
      <span>${hotels.length} result${hotels.length === 1 ? '' : 's'}</span>
    </div>
    <div class="hotel-grid" id="hotelGrid"></div>
  `;

  const grid = document.getElementById('hotelGrid');
  hotels.forEach((hotel, idx) => {
    const card = document.createElement('div');
    card.className = 'hotel-card';
    card.innerHTML = `
      <span class="badge">${hotel.stars ? hotel.stars + '★ rated' : 'OpenStreetMap listing'}</span>
      <h3>${escapeHtml(hotel.name)}</h3>
      <div class="addr">${escapeHtml(hotel.address)}</div>
      <div class="meta">
        ${hotel.phone ? `<span>📞 ${escapeHtml(hotel.phone)}</span>` : ''}
      </div>
      <button class="select-btn" data-idx="${idx}">Select Hotel</button>
    `;
    grid.appendChild(card);

    card.querySelector('.select-btn').addEventListener('click', () => {
      grid.querySelectorAll('.hotel-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      showBookingSummary(hotel);
    });
  });
}

function showBookingSummary(hotel){
  const nights = Math.round((new Date(checkoutInput.value) - new Date(checkinInput.value)) / 86400000);
  bookingSummary.innerHTML = `
    <h2>Your Selection</h2>
    <div class="row"><span>Hotel</span><span>${escapeHtml(hotel.name)}</span></div>
    <div class="row"><span>City</span><span>${escapeHtml(selectedCity.name)}, ${escapeHtml(selectedCity.country || '')}</span></div>
    <div class="row"><span>Check-in</span><span>${checkinInput.value}</span></div>
    <div class="row"><span>Check-out</span><span>${checkoutInput.value}</span></div>
    <div class="row"><span>Nights</span><span>${nights}</span></div>
    <div class="row"><span>Guests</span><span>${guestsSelect.value}</span></div>
    <button class="confirm-btn" id="confirmBtn">Confirm Booking (Demo)</button>
  `;
  bookingSummary.classList.add('open');
  bookingSummary.scrollIntoView({behavior:'smooth', block:'center'});

  document.getElementById('confirmBtn').addEventListener('click', () => {
    alert(`Demo booking confirmed for ${hotel.name}.\nThis project does not process real payments or reservations.`);
  });
}

function showStatus(msg, isError){
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg' + (isError ? ' error' : '');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('apiNote').textContent =
  'City data: Open-Meteo Geocoding API. Hotel listings: OpenStreetMap (via Overpass API), community-sourced data — names and addresses are real, but availability and pricing are not live and no payment is processed.';
</script>

</body>
</html>
