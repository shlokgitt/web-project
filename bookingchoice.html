<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Booking Type | TravelGo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:        #0B1622;
  --ink-raised: #142536;
  --ink-line:   #1F3850;
  --terracotta: #C9542C;
  --terracotta-bright: #E0673B;
  --amber:      #E8A33D;
  --paper:      #F4F1E8;
  --slate:      #8FA3B8;

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 16px;
  --shadow-deep: 0 20px 50px rgba(0,0,0,0.45);
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--paper);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

h1,h2{ font-family:var(--font-display); font-weight:600; }

header{
  background:var(--ink-raised);
  border-bottom:1px solid var(--ink-line);
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header .logo{ font-size:1.4rem; }
header .logo span{ color:var(--terracotta); }
header nav a{
  color:var(--slate);
  text-decoration:none;
  margin-left:22px;
  font-size:0.92rem;
  font-weight:500;
}
header nav a:hover{ color:var(--paper); }

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:60px 6%;
  text-align:center;
}

.eyebrow{
  font-family:var(--font-mono);
  font-size:0.75rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--terracotta);
  margin-bottom:12px;
  display:block;
}

main h1{
  font-size:clamp(1.9rem, 4vw, 2.6rem);
  color:#fff;
  margin-bottom:46px;
}

.container{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
  max-width:760px;
}

.option-card{
  background:var(--ink-raised);
  border:1px solid var(--ink-line);
  width:280px;
  padding:38px 28px;
  border-radius:var(--radius);
  text-align:center;
  box-shadow:var(--shadow-deep);
  transition:transform 0.25s, border-color 0.25s;
}
.option-card:hover{
  transform:translateY(-6px);
  border-color:var(--terracotta);
}

.option-card .icon{
  font-size:2.6rem;
  margin-bottom:18px;
  display:block;
}

.option-card h2{
  font-size:1.3rem;
  color:#fff;
  margin-bottom:10px;
}

.option-card p{
  color:var(--slate);
  font-size:0.92rem;
  margin-bottom:26px;
}

.option-card a{
  display:inline-block;
  padding:13px 30px;
  background:var(--terracotta);
  color:#fff;
  text-decoration:none;
  border-radius:9px;
  font-weight:700;
  font-size:0.95rem;
  transition:background 0.2s;
}
.option-card a:hover{ background:var(--terracotta-bright); }

footer{
  background:var(--ink-raised);
  border-top:1px solid var(--ink-line);
  color:var(--slate);
  text-align:center;
  padding:20px;
  font-size:0.82rem;
  font-family:var(--font-mono);
}

@media(max-width:640px){
  header nav{ display:none; }
}
</style>
</head>

<body>

<header>
    <div class="logo">Travel<span>Go</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="contactpage.html">Contact</a>
    </nav>
</header>

<main>
    <span class="eyebrow">Step 1 of 3</span>
    <h1>What would you like to book?</h1>

    <div class="container">
        <div class="option-card">
            <span class="icon">✈️</span>
            <h2>Book Flight</h2>
            <p>Search real airports and see live aircraft in the sky.</p>
            <a href="flightbooking.html">Book Flight</a>
        </div>

        <div class="option-card">
            <span class="icon">🏨</span>
            <h2>Book Hotel</h2>
            <p>Find real hotels in any city, anywhere in the world.</p>
            <a href="hotelbooking.html">Book Hotel</a>
        </div>
    </div>
</main>

<footer>© 2026 TravelGo · All Rights Reserved</footer>

</body>
</html>
