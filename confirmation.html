<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | TravelGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:        #0B1622;
  --ink-raised: #142536;
  --ink-line:   #1F3850;
  --terracotta: #C9542C;
  --terracotta-bright: #E0673B;
  --amber:      #E8A33D;
  --paper:      #F4F1E8;
  --slate:      #8FA3B8;

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 16px;
  --shadow-deep: 0 20px 50px rgba(0,0,0,0.45);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--paper);
  min-height:100vh;
}
h1,h2{ font-family:var(--font-display); font-weight:600; }

header{
  background:var(--ink-raised);
  border-bottom:1px solid var(--ink-line);
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header .logo{ font-size:1.4rem; }
header .logo span{ color:var(--terracotta); }
header nav a{
  color:var(--slate);
  text-decoration:none;
  margin-left:22px;
  font-size:0.92rem;
  font-weight:500;
}
header nav a:hover{ color:var(--paper); }

.page-head{ text-align:center; padding:60px 6% 10px; }
.eyebrow{
  font-family:var(--font-mono);
  font-size:0.75rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--terracotta);
  margin-bottom:12px;
  display:block;
}
.page-head h1{ font-size:clamp(1.9rem, 4vw, 2.6rem); color:#fff; margin-bottom:14px; }
.page-head p{ color:var(--slate); max-width:520px; margin:0 auto; }

.contact-container{
  max-width:920px;
  margin:50px auto 80px;
  background:var(--ink-raised);
  border:1px solid var(--ink-line);
  padding:44px;
  border-radius:var(--radius);
  box-shadow:var(--shadow-deep);
}

.contact-info{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:24px;
  margin-bottom:42px;
  padding-bottom:36px;
  border-bottom:1px dashed var(--ink-line);
}
.info-box{ flex:1; min-width:220px; }
.info-box h3{
  color:var(--terracotta-bright);
  margin-bottom:10px;
  font-size:1.02rem;
  font-weight:700;
}
.info-box p{ color:var(--slate); font-size:0.94rem; line-height:1.6; }

form{ display:flex; flex-direction:column; gap:16px; }

input, textarea{
  width:100%;
  padding:14px 16px;
  border-radius:9px;
  border:1px solid var(--ink-line);
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:0.95rem;
  outline:none;
  transition:border-color 0.2s;
}
input::placeholder, textarea::placeholder{ color:var(--slate); }
input:focus, textarea:focus{ border-color:var(--terracotta); }

button{
  background:var(--terracotta);
  color:#fff;
  border:none;
  padding:14px 28px;
  border-radius:9px;
  cursor:pointer;
  font-size:0.98rem;
  font-weight:700;
  align-self:flex-start;
  transition:background 0.2s;
}
button:hover{ background:var(--terracotta-bright); }

footer{
  background:var(--ink-raised);
  border-top:1px solid var(--ink-line);
  color:var(--slate);
  text-align:center;
  padding:20px;
  font-size:0.82rem;
  font-family:var(--font-mono);
}

@media(max-width:640px){
  header nav{ display:none; }
  .contact-container{ padding:28px; margin:30px auto 50px; }
}
</style>
</head>
<body>

<header>
    <div class="logo">Travel<span>Go</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="bookingchoice.html">Booking</a>
    </nav>
</header>

<div class="page-head">
    <span class="eyebrow">We're Here to Help</span>
    <h1>Contact Us</h1>
    <p>Have questions or need help planning your next adventure? We're here to help!</p>
</div>

<div class="contact-container">
    <div class="contact-info">
        <div class="info-box">
            <h3>📍 Address</h3>
            <p>Travel Go<br>Varanasi<br>Uttar Pradesh</p>
        </div>

        <div class="info-box">
            <h3>📞 Phone</h3>
            <p>+1 234 567 890</p>
        </div>

        <div class="info-box">
            <h3>✉️ Email</h3>
            <p>alternate03125@gmail.com</p>
        </div>
    </div>

    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</div>

<footer>© 2026 TravelGo · All Rights Reserved</footer>

</body>
</html>
